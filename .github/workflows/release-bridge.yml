name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows Build ─────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version
        shell: bash

      # Bridge exe
      - name: Install bridge dependencies
        run: npm install
        working-directory: bridge

      - name: Build adb-bridge.exe
        run: npx pkg server.js --target node20-win-x64 --output adb-bridge.exe
        working-directory: bridge

      # Electron installer
      - name: Install app dependencies
        run: npm install

      - name: Build Vite app for Electron
        run: npm run build:electron

      - name: Bundle ADB for Electron
        run: |
          mkdir tools
          copy "%ANDROID_HOME%\platform-tools\adb.exe" tools\
          copy "%ANDROID_HOME%\platform-tools\AdbWinApi.dll" tools\
          copy "%ANDROID_HOME%\platform-tools\AdbWinUsbApi.dll" tools\
        shell: cmd

      - name: Build Electron installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            bridge/adb-bridge.exe
            electron-dist/*.exe
            electron-dist/*.yml
            electron-dist/*.blockmap

  # ── Linux Build ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      # Bridge binary
      - name: Install bridge dependencies
        run: npm install
        working-directory: bridge

      - name: Build adb-bridge-linux
        run: npx pkg server.js --target node20-linux-x64 --output adb-bridge-linux
        working-directory: bridge

      # Electron AppImage
      - name: Install app dependencies
        run: npm install

      - name: Build Vite app for Electron
        run: npm run build:electron

      - name: Bundle ADB for Electron
        run: |
          mkdir -p tools
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            cp "$ANDROID_HOME/platform-tools/adb" tools/
          else
            echo "Android platform-tools not found, downloading..."
            curl -sL https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o pt.zip
            unzip -qo pt.zip
            cp platform-tools/adb tools/
            rm -rf platform-tools pt.zip
          fi
          chmod +x tools/adb

      - name: Build Electron AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            bridge/adb-bridge-linux
            electron-dist/*.AppImage
            electron-dist/*.yml

  # ── Release & Publish ────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: artifacts/linux

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/bridge/adb-bridge.exe
            artifacts/windows/electron-dist/*.exe
            artifacts/windows/electron-dist/latest.yml
            artifacts/linux/bridge/adb-bridge-linux
            artifacts/linux/electron-dist/*.AppImage
          generate_release_notes: true

      # npm Publish
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Install dependencies & build for npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install && npm run build:npm

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
